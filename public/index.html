    <title>E-shop commerce</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <div id="weiboo-load">
      <div class="preloader-new">
        <svg class="cart_preloader" role="img"
          aria-label="Shopping cart_preloader line animation"
          viewBox="0 0 128 128" width="128px" height="128px"
          xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round"
            stroke-width="8">
            <g class="cart__track" stroke="hsla(0,10%,10%,0.1)">
              <polyline points="4,4 21,4 26,22 124,22 112,64 35,64 39,80 106,80" />
              <circle cx="43" cy="111" r="13" />
              <circle cx="102" cy="111" r="13" />
            </g>
            <g class="cart__lines" stroke="currentColor">
              <polyline class="cart__top"
                points="4,4 21,4 26,22 124,22 112,64 35,64 39,80 106,80"
                stroke-dasharray="338 338" stroke-dashoffset="-338" />
              <g class="cart__wheel1" transform="rotate(-90,43,111)">
                <circle class="cart__wheel-stroke" cx="43" cy="111" r="13"
                  stroke-dasharray="81.68 81.68"
                  stroke-dashoffset="81.68" />
              </g>
              <g class="cart__wheel2" transform="rotate(90,102,111)">
                <circle class="cart__wheel-stroke" cx="102" cy="111" r="13"
                  stroke-dasharray="81.68 81.68"
                  stroke-dashoffset="81.68" />
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <div class="anywere anywere-home"></div>
    

    <div class="scroll-top-btn scroll-top-btn1">
      <i class="fas fa-angle-up arrow-up"></i><i class="fas fa-circle-notch"></i>
    </div>
    <!--================= Scroll to Top End =================-->

    <!--================= Jquery latest version =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/jquery-3.6.0.min.js"></script>
    <!--================= Bootstrap latest version =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/bootstrap.min.js"></script>
    <!--================= Wow.js =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/wow.min.js"></script>
    <!--================= Swiper Slider =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/swiper-bundle.min.js"></script>
    <!--================= Nice Select =================-->

    <!--================= Zoom Plugin =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/zoom.js"></script>
    <!--================= metisMenu Plugin =================-->
    <script src="%PUBLIC_URL%/assets/js/vendors/metisMenu.min.js"></script>
    <!--================= Main Menu Plugin =================-->

    <!--================= Magnefic Popup Plugin =================-->

    <!--================= Magnefic Popup Plugin =================-->
